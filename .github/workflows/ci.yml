name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'services/pikobot[dev]' pika==1.3.2 requests==2.32.3
      - run: docker compose config --quiet
      - run: bash -n scripts/redeploy.sh
      - run: python -m pytest -q tests
      - run: python -m pytest -q tests
        working-directory: services/workflow-orchestrator
      - run: python -m pytest -q tests
        working-directory: services/jira-bot
      - run: python -m pytest -q tests
        working-directory: services/gitlab-adapter
      - run: python -m pytest -q tests
        working-directory: services/guardian
      - run: python -m pytest -q tests/channels/test_rabbitmq_role_queue.py tests/channels/test_base_channel.py
        working-directory: services/pikobot
